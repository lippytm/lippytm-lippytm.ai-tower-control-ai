name: Dependency Review

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Audit locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate lockfile against the manifest without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Block high and critical dependency advisories
        run: npm audit --package-lock-only --audit-level=high
