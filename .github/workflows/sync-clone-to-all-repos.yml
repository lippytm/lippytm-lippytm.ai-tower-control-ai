name: Sync Clone Connection to All Repos

# Pushes CLONE_CONNECTION.md from fleet/clone/ to every repo in the lippytm empire.
# This creates the two-way link: every repo knows it is part of the AI Clone.
#
# Required secret in this repo's Settings → Secrets:
#   CLONE_REPO_PAT — a GitHub Personal Access Token (classic) with 'repo' scope
#                    (same secret used by sync-to-clone.yml)
#
# File pushed to each repo:
#   fleet/clone/CLONE_CONNECTION.md → CLONE_CONNECTION.md (repo root)
#
# To add or remove repos, edit the REPOS list in the "Push to all repos" step.

on:
  push:
    branches:
      - main
    paths:
      - 'fleet/clone/CLONE_CONNECTION.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list repos but skip all pushes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      target_repo:
        description: 'Push to one specific repo only (e.g. lippytm/Factory.ai). Leave blank for all repos.'
        required: false
        default: ''

jobs:
  sync-connection-to-all-repos:
    name: Sync Clone connection file
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Control Tower
        uses: actions/checkout@v4

      - name: Validate source file
        run: |
          if [ ! -f "fleet/clone/CLONE_CONNECTION.md" ]; then
            echo "ERROR: fleet/clone/CLONE_CONNECTION.md not found"
            exit 1
          fi
          echo "Source file validated: fleet/clone/CLONE_CONNECTION.md"
          wc -l fleet/clone/CLONE_CONNECTION.md

      - name: Push CLONE_CONNECTION.md to all repos
        env:
          PAT: ${{ secrets.CLONE_REPO_PAT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_REPO: ${{ github.event.inputs.target_repo || '' }}
        run: |
          # ── Full repo list ──────────────────────────────────────────────────
          REPOS=(
            "lippytm/lippytm-lippytm.ai-tower-control-ai"
            "lippytm/AI-Clone-of-Charles-Earl-Lipshay-lippytm-lippytm.AI-lippytmai-"
            "lippytm/lippytm.ai"
            "lippytm/AI-Time-Machines"
            "lippytm/Factory.ai"
            "lippytm/AI-Autonomous-Systems-for-all-of-my-lippytm.ai-Repositories-Research-and-Development-integration-"
            "lippytm/Hermes-AI-Hermes"
            "lippytm/Prompt-11-"
            "lippytm/AllBots.com"
            "lippytm/AllBots.com.ai"
            "lippytm/Chatlippytm.ai.Bots"
            "lippytm/ClawBase44.ai.Bots"
            "lippytm/Clawlippytm.Bots"
            "lippytm/Clawlippytm.ai.Bots"
            "lippytm/Web3AI"
            "lippytm/AI-Full-Stack-AI-DevOps-Synthetic-Intelligence-Engines-AgentsBots-Web3-Websites-"
            "lippytm/Transparency-Logic-Time-Machine-Bots-"
            "lippytm/Time-Machines-Builders-"
            "lippytm/MyClaw.lippytm.AI-"
            "lippytm/OpenClaw-lippytm.AI-"
            "lippytm/Base44-"
            "lippytm/Evolutionary-Evolutions-Social-Multimedia-Networks-Agency-"
            "lippytm/AI-Intergalactic-Zoological-Social-Multimedia-Agency-Networks-"
            "lippytm/The-Encyclopedia-of-Everything-Applied-ChatAIBots"
            "lippytm/The-Encyclopedia-of-Law-Civilian-Law-Military-Law-Business-Law-AI-Law.-"
            "lippytm/Quantum-Questions-of-the-Many-Worlds-Universes-of-Reruns-"
            "lippytm/lippytmai.getbizfunds.com-"
            "lippytm/lippytmai.zo.computer-"
            "lippytm/http-famous.ai-fpr-charles92"
            "lippytm/gatsby-starter-blog"
            "lippytm/docs"
          )

          # ── Filter to single repo if requested ──────────────────────────────
          if [ -n "$TARGET_REPO" ]; then
            REPOS=("$TARGET_REPO")
            echo "Targeting single repo: $TARGET_REPO"
          fi

          # ── Configure git ───────────────────────────────────────────────────
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          SUCCEEDED=0
          SKIPPED=0
          FAILED=0
          FAILED_REPOS=()

          for REPO in "${REPOS[@]}"; do
            echo ""
            echo "──────────────────────────────────────────"
            echo "Processing: $REPO"

            if [ "$DRY_RUN" = "true" ]; then
              echo "  DRY RUN — would push CLONE_CONNECTION.md to $REPO"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            REPO_NAME=$(basename "$REPO")
            WORK_DIR="/tmp/clone-sync-$REPO_NAME"
            rm -rf "$WORK_DIR"

            # Clone the target repo (shallow, default branch)
            if ! git clone \
              --depth 1 \
              "https://x-access-token:${PAT}@github.com/${REPO}.git" \
              "$WORK_DIR" 2>&1; then
              echo "  WARN: Could not clone $REPO — skipping"
              FAILED=$((FAILED + 1))
              FAILED_REPOS+=("$REPO")
              continue
            fi

            # Copy the connection file
            cp fleet/clone/CLONE_CONNECTION.md "$WORK_DIR/CLONE_CONNECTION.md"

            cd "$WORK_DIR"
            git add CLONE_CONNECTION.md

            if git diff --cached --quiet; then
              echo "  No changes — $REPO already up to date"
              SKIPPED=$((SKIPPED + 1))
            else
              git commit -m "sync: add/update CLONE_CONNECTION.md from lippytm.ai Control Tower [skip ci]"
              if git push 2>&1; then
                echo "  ✓ Pushed to $REPO"
                SUCCEEDED=$((SUCCEEDED + 1))
              else
                echo "  WARN: Push failed for $REPO"
                FAILED=$((FAILED + 1))
                FAILED_REPOS+=("$REPO")
              fi
            fi

            cd - > /dev/null
            rm -rf "$WORK_DIR"
          done

          echo ""
          echo "══════════════════════════════════════════"
          echo "SYNC COMPLETE"
          echo "  ✓ Pushed:   $SUCCEEDED repos"
          echo "  ~ Skipped:  $SKIPPED repos (no changes or dry run)"
          echo "  ✗ Failed:   $FAILED repos"
          if [ ${#FAILED_REPOS[@]} -gt 0 ]; then
            echo "  Failed repos:"
            for R in "${FAILED_REPOS[@]}"; do
              echo "    - $R"
            done
          fi
          echo "══════════════════════════════════════════"

          # Fail the job if any pushes failed
          if [ $FAILED -gt 0 ] && [ "$DRY_RUN" != "true" ]; then
            echo ""
            echo "One or more repos failed. Check logs above for details."
            exit 1
          fi
