name: Webhook Dispatcher (Sync Simulation)

on:
  workflow_dispatch:
    inputs:
      event_type:
        description: Source connector followed by -sync (for example openai-sync)
        required: true
        type: string
      payload:
        description: JSON with source, target, and optional options; simulation only
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch simulated sync job
    runs-on: ubuntu-latest
    environment: ai-pilot
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Validate and dispatch JSON without shell interpolation
        env:
          TOWER_API_URL: ${{ secrets.TOWER_API_URL }}
          TOWER_CLIENT_ID: ${{ secrets.TOWER_CLIENT_ID }}
          TOWER_CLIENT_SECRET: ${{ secrets.TOWER_CLIENT_SECRET }}
          SYNC_EVENT_TYPE: ${{ inputs.event_type }}
          SYNC_PAYLOAD: ${{ inputs.payload }}
        run: node scripts/dispatch-sync.js
