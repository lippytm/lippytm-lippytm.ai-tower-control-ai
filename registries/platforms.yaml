platform_registry:
  owner: "lippytm"
  portfolio: "lippytm.AI AI Clone Engine"
  control_tower_repo: "lippytm/lippytm-lippytm.ai-tower-control-ai"
  identity_layer:
    personal_original_email: "lippytimemachines@gmail.com"
    business_development_email: "lippytmai.biz@gmail.com"

  platforms:
    - name: "ChatGPT"
      type: "planning_documentation_repo_coordination"
      primary_uses:
        - "systems architecture"
        - "GitHub documentation"
        - "prompt packs"
        - "business development plans"
        - "AI Clone Engine registry work"
      github_output_types:
        - "markdown docs"
        - "snippets"
        - "registries"
        - "issues"
        - "repository setup files"

    - name: "Claude"
      type: "long_form_writing_artifact_drafting"
      primary_uses:
        - "ebooks"
        - "sales pages"
        - "long-form restructuring"
        - "product documents"
        - "campaign copy"
      github_output_types:
        - "draft documents"
        - "product files"
        - "campaign files"
        - "handoff notes"

    - name: "Hermes Agent"
      type: "coordination_messenger_dispatch"
      swarm_position: "Layer 0 Dispatcher — between Marvin Tower and specialist Marvins"
      primary_uses:
        - "task routing"
        - "agent handoffs"
        - "workflow updates"
        - "cross-platform communication"
        - "project dispatch"
        - "risk flagging before high-risk routing"
      github_output_types:
        - "handoff logs"
        - "dispatch notes"
        - "agent routing files"
        - "task issues"
      artifact_output_folder: "agents/hermes/logs/"
      definition_folder: "agents/hermes/"
      swarm_integration:
        reports_to: "Marvin Tower"
        dispatches_to:
          - "Marvin Factory"
          - "Marvin AllBots"
          - "Marvin Web3"
          - "Marvin DevOps"
          - "Marvin Prime"
          - "Marvin AdCopy"
          - "Marvin Copyright"
          - "Marvin Encyclopedia"
          - "Marvin Affiliate"
          - "Marvin Funding"
          - "Marvin Support"
          - "Marvin Cloner"
      dispatch_protocol:
        classify_task: true
        produce_dispatch_note: true
        flag_high_risk: true
        log_to_github: true
        human_review_required_for:
          - "customer-facing publishing"
          - "financial, legal, tax, investment, or funding claims"
          - "production deployment"
          - "customer or private data workflows"
      integration_spec: "docs/ai-clone-engine/HERMES-SWARM-INTEGRATION.md"

    - name: "Fable 5"
      type: "story_universe_media_franchise_development"
      primary_uses:
        - "story universes"
        - "fictional systems"
        - "media concepts"
        - "educational entertainment branches"
        - "franchise planning"
      github_output_types:
        - "universe bibles"
        - "character maps"
        - "episode concepts"
        - "creative branch files"
        - "media campaign notes"

    - name: "Grok"
      type: "research_social_awareness_alternate_viewpoint"
      primary_uses:
        - "research scanning"
        - "current-topic awareness"
        - "social trend exploration"
        - "alternate framing"
        - "idea testing"
      github_output_types:
        - "research notes"
        - "comparison notes"
        - "dated summaries"
        - "verification checklists"

  operating_rule: "Each AI platform may generate work, but reusable outputs should be saved into GitHub as docs, issues, prompts, registries, product files, campaign files, or RiskGate notes."
