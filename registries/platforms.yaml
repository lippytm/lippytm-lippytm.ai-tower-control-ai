platform_registry:
  owner: "lippytm"
  portfolio: "lippytm.AI AI Clone Engine"
  control_tower_repo: "lippytm/lippytm-lippytm.ai-tower-control-ai"
  identity_layer:
    personal_original_email: "lippytimemachines@gmail.com"
    business_development_email: "lippytmai.biz@gmail.com"

  platforms:
    - name: "ChatGPT"
      type: "planning_documentation_repo_coordination"
      primary_uses:
        - "systems architecture"
        - "GitHub documentation"
        - "prompt packs"
        - "business development plans"
        - "AI Clone Engine registry work"
      github_output_types:
        - "markdown docs"
        - "snippets"
        - "registries"
        - "issues"
        - "repository setup files"

    - name: "Claude"
      type: "long_form_writing_artifact_drafting"
      primary_uses:
        - "ebooks"
        - "sales pages"
        - "long-form restructuring"
        - "product documents"
        - "campaign copy"
      github_output_types:
        - "draft documents"
        - "product files"
        - "campaign files"
        - "handoff notes"

    - name: "Hermes Agent"
      type: "coordination_messenger_dispatch"
      primary_uses:
        - "task routing"
        - "agent handoffs"
        - "workflow updates"
        - "cross-platform communication"
        - "project dispatch"
      github_output_types:
        - "handoff logs"
        - "dispatch notes"
        - "agent routing files"
        - "task issues"

    - name: "Fable 5"
      type: "story_universe_media_franchise_development"
      primary_uses:
        - "story universes"
        - "fictional systems"
        - "media concepts"
        - "educational entertainment branches"
        - "franchise planning"
      github_output_types:
        - "universe bibles"
        - "character maps"
        - "episode concepts"
        - "creative branch files"
        - "media campaign notes"

    - name: "Grok"
      type: "research_social_awareness_alternate_viewpoint"
      primary_uses:
        - "research scanning"
        - "current-topic awareness"
        - "social trend exploration"
        - "alternate framing"
        - "idea testing"
      github_output_types:
        - "research notes"
        - "comparison notes"
        - "dated summaries"
        - "verification checklists"

    - name: "Hermes + Fabric"
      type: "advanced_reasoning_pattern_extraction_problem_solving"
      model_notes: "Hermes refers to NousResearch Hermes fine-tuned models (e.g., Hermes-3); Fabric is Daniel Miessler's open-source AI augmentation framework providing reusable prompt patterns."
      primary_uses:
        - "multi-step reasoning and analysis"
        - "pattern extraction from text, data, or conversations"
        - "structured problem decomposition"
        - "AI-assisted monetization strategy generation"
        - "Fabric pattern library integration for reusable prompt pipelines"
        - "content distillation and summarization"
        - "idea-to-action pipelines via Fabric patterns"
      github_output_types:
        - "structured analysis docs"
        - "problem-solution maps"
        - "Fabric pattern invocation logs"
        - "monetization strategy notes"
        - "distilled insight summaries"
        - "prompt pipeline templates"
      fabric_patterns_reference: "https://github.com/danielmiessler/fabric"
      hermes_model_reference: "https://huggingface.co/NousResearch"
      risk_level: medium
      human_review_required: true

  operating_rule: "Each AI platform may generate work, but reusable outputs should be saved into GitHub as docs, issues, prompts, registries, product files, campaign files, or RiskGate notes."
