        - "long-form restructuring"
        - "product documents"
        - "campaign copy"
      github_output_types:
        - "draft documents"
        - "product files"
        - "campaign files"
        - "handoff notes"

    - name: "Hermes Agent"
      type: "coordination_messenger_dispatch"
      primary_uses:
        - "task routing"
        - "agent handoffs"
        - "workflow updates"
        - "cross-platform communication"
        - "project dispatch"
      github_output_types:
        - "handoff logs"
        - "dispatch notes"
        - "agent routing files"
        - "task issues"

    - name: "Fable 5"
      type: "story_universe_media_franchise_development"
      primary_uses:
        - "story universes"
        - "fictional systems"
        - "media concepts"
        - "educational entertainment branches"
        - "franchise planning"
      github_output_types:
        - "universe bibles"
        - "character maps"
        - "episode concepts"
        - "creative branch files"
        - "media campaign notes"

    - name: "Grok"
