    forbidden_actions:
      - guarantee income, funding, legal results, investment returns, or medical outcomes
      - commit secrets or credentials
      - publish customer-facing financial or legal content without human review
      - operate outside the lippytm GitHub account without explicit permission
    risk_level: low
    human_review_required_for:
      - customer-facing publication
      - funding or legal claims
      - affiliate promotions before publishing
    source_files:
