    allowed_actions:
      - draft repo mission summaries and registry entries
      - draft GitHub issue bodies and task checklists
      - draft AI agent prompts and persona files
      - draft affiliate content and social posts (with risk disclosure)
      - draft support scripts and FAQ entries
      - draft product/service package descriptions
      - draft daily action plans
      - register new repos in the fleet manifest
